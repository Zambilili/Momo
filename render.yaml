# Déploiement Render (site statique) : https://render.com/docs/static-sites
services:
  - type: web
    name: momo-tech
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /js/vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
